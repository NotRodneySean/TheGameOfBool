    <style>
      :root {
        --charcoal: oklch(12.9% 0.042 264.695);
        --bs-body-font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      .app {
        height: 100vh;
        height: 100dvh;
      }
      .layout {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      .main-area {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--charcoal);
        color: #e6edf3;
      }
      .panel {
        flex-direction: column;
      }
      .controls-panel {
        background: var(--periwinkle);
      }
      .controls-bg,
      .controls-bg svg {
        color: #fff;
        background: oklch(20.8% 0.042 265.755);
      }
      .instructions-panel {
        background: #fff;
      }
      .panel-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 1rem;
      }

      @media (max-width: 991.98px) {
        .panel {
          position: absolute;
          inset: 0;
          z-index: 20;
        }
      }
      @media (min-width: 992px) {
        .layout {
          display: grid;
          grid-template-columns: 280px minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr);
        }
        .main-area {
          position: relative;
          inset: auto;
          grid-column: 2;
          grid-row: 1;
        }
        .controls-panel {
          position: relative;
          min-height: 0;
          grid-column: 1;
          grid-row: 1;
        }
        .instructions-panel {
          position: absolute;
          inset: 0;
          z-index: 30;
        }
        .instructions-panel .panel-scroll {
          padding: 1.5rem 4rem 2rem 2rem;
        }
      }

      .close-btn {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 44px;
        height: 44px;
        z-index: 2;
      }
      .bottom-nav {
        height: 64px;
        box-sizing: content-box;
        background: oklch(27.9% 0.041 260.031);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .nav-tab {
        border: 0;
        border-radius: 0;
        background: transparent;
        color: oklch(98.4% 0.003 247.858);
        font-size: 0.875rem;
        font-weight: 500;
      }
      .nav-tab:hover,
      .nav-tab:active .nav-tab[aria-pressed="true"] {
        color: oklch(92.9% 0.013 255.508);
        background: oklch(20.8% 0.042 265.755);
      }
      .nav-tab[aria-pressed="true"] {
        color: oklch(92.9% 0.013 255.508);
        background: oklch(27.9% 0.041 260.031);
      }
      button.nav-tab:active svg,
      .btn:first-child:active {
        color: oklch(92.9% 0.013 255.508);
      }

      /* Board */
      .board-wrap {
        width: 100%;
        height: 100%;
      }
      .board-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .node {
        cursor: pointer;
      }
      .node:hover {
        filter: brightness(1.15);
      }
      .node circle {
        stroke: #0c1220;
        stroke-width: 2;
      }
      .node text {
        font: 12px monospace;
        fill: #0c1220;
        user-select: none;
      }
      .owned circle {
        stroke-width: 2.6;
      }
      .lastmove circle {
        stroke: #6aa9ff;
        stroke-width: 3;
      }

      .rules canvas {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0.5rem 0 1rem;

      .result-dialog {
        border: 0;
        border-radius: 18px;

        height: 44px;

      .controls-bg {
        overflow-wrap: anywhere;

      .controls-panel {
        min-height: 0;

        overflow-y: auto;

      .controls-footer {

    <style>
      /* Subtle retro background */
      .main-area {
        isolation: isolate;
        background-color: #080d19;
        background-image:
          radial-gradient(
            ellipse at 0% 100%,
            rgba(175, 70, 205, 0.14),
            transparent 60%
          ),
          radial-gradient(
            ellipse at 100% 0%,
            rgba(30, 175, 205, 0.12),
            transparent 55%
          );
      }

      /* Fixed 56px grid keeps moving highlights aligned with its lines. */
      .main-area::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(103, 205, 230, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(103, 205, 230, 0.1) 1px, transparent 1px);
        background-size: 56px 56px;
        animation: none;
        transform: none;
      }

      /* Each gradient is a short, soft-ended section, never a full bright line. */
      .main-area::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(
            90deg,
            transparent,
            rgba(135, 225, 245, 0.32),
            transparent
          ),
          linear-gradient(
            90deg,
            transparent,
            rgba(185, 145, 240, 0.25),
            transparent
          ),
          linear-gradient(
            180deg,
            transparent,
            rgba(135, 225, 245, 0.3),
            transparent
          ),
          linear-gradient(
            180deg,
            transparent,
            rgba(185, 145, 240, 0.23),
            transparent
          );
        background-size:
          150px 1px,
          110px 1px,
          1px 140px,
          1px 100px;
        background-repeat: no-repeat;
        background-position:
          -160px 112px,
          calc(100% + 120px) 224px,
          112px -150px,
          224px calc(100% + 110px);
        animation: bool-retro-highlights 12s linear infinite;
      }

      .main-area > .board-wrap {
        position: relative;
        z-index: 1;
        background: transparent;
      }

      @keyframes bool-retro-highlights {
        from {
          background-position:
            -160px 112px,
            calc(100% + 120px) 224px,
            112px -150px,
            224px calc(100% + 110px);
        }
        to {
          background-position:
            calc(100% + 160px) 112px,
            -120px 224px,
            112px calc(100% + 150px),
            224px -110px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .main-area::after {
          animation: none;
          background-image: none;
        }
      }
    </style>

  <body>
    <div id="app"></div>
    <template id="instructions-tpl">
      <div class="rules">
        <h2 class="h5">
          Boolean Algebra Disguised as Tic-Tac-Toe Allows You To Capture Your
          Opponents Positions!
        </h2>
        <p>
          <a
            href="https://kevinpowell.rf.gd/Boolean.pdf"
            target="_blank"
            rel="noopener"
            >Download Printable Game Board</a
          >
        </p>

        <h3 class="h5">Rules of Bool</h3>
        <ul>
          <li>
            Pretend that you are player X. On your turn, choose one node to mark
            with an X. You are allowed to capture the meet
            <em>(see description below)</em> between your chosen node and any
            other node currently marked as X. You are also allowed to capture
            the join <em>(see description below)</em> between your chosen node
            and any other node currently marked as X.
          </li>
          <li>
            Again, pretend that you are player X. If you have obtained two
            adjacent nodes connected by one single edge, then you have also
            captured that edge.
          </li>
          <li>
            The first player to capture enough edges to make a path from the top
            to the bottom wins.
          </li>
        </ul>

        <h3 class="h5">Join and Meet</h3>
        <p>
          <strong>Join:</strong> The join of two vertices A and B is the lowest
          vertex that has either a downward or "stay-put" path to both A and B.
        </p>
        <canvas id="g1" width="600" height="350"></canvas>
        <canvas id="g2" width="600" height="250"></canvas>
        <canvas id="g3" width="600" height="250"></canvas>

        <p>
          <strong>Meet:</strong> The meet of two vertices A and B is the highest
          vertex that has either an upward or "stay-put" path to both A and B.
        </p>
        <canvas id="g4" width="600" height="350"></canvas>
        <canvas id="g5" width="600" height="350"></canvas>
        <canvas id="g6" width="600" height="250"></canvas>

        <p class="text-center">
          Original Idea by Kevin Powell. The initial version of the game above
          was vibe-coded by Adam Teichert.
        </p>
      </div>
    </template>
    <script src="https://unpkg.com/preact@10.22.0/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/preact@10.22.0/hooks/dist/hooks.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
      const { h, render } = preact;
      const { useState, useMemo, useRef, useEffect, useCallback } = preactHooks;
      const html = htm.bind(h);

      // Replace these two values with your Supabase project values.
      const SUPABASE_URL = "https://qbfcdibyjppvqxsehsbx.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_wQDPkHadnBFdA_P_8JJA-A_s8UfnnCQ";
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const popcount = (n) => {
        n = n - ((n >>> 1) & 0x55555555);
        n = (n & 0x33333333) + ((n >>> 2) & 0x33333333);
        return (((n + (n >>> 4)) & 0x0f0f0f0f) * 0x01010101) >>> 24;
      };
      const range = (n) => Array.from({ length: n }, (_, i) => i);
      const bitsOf = (n, k) => range(k).filter((b) => (n >> b) & 1);

      function layoutNodes(k, W = 700, H = 700, pad = 50) {
        const levels = range(k + 1).map(() => []);
        for (let v = 0; v < 1 << k; v++) levels[popcount(v)].push(v);
        const pos = new Map();
        levels.forEach((arr, levelIdx) => {
          const y = H - (pad + (levelIdx * (H - 2 * pad)) / k);
          const n = arr.length;
          arr.sort((a, b) => a - b);
          arr.forEach((v, i) => {
            const x = n === 1 ? W / 2 : pad + (i * (W - 2 * pad)) / (n - 1);
            pos.set(v, { x, y });
          });
        });
        const edges = [];
        for (let v = 0; v < 1 << k; v++)
          for (let b = 0; b < k; b++)
            if (((v >> b) & 1) === 0) edges.push([v, v | (1 << b)]);
        return { positions: pos, edges, levels };
      }

      function computePath(k, ownedSet) {
        const top = (1 << k) - 1,
          bottom = 0;
        if (!ownedSet.has(top) || !ownedSet.has(bottom)) return null;
        const stack = [[top, [top]]];
        const seen = new Set([top]);
        while (stack.length) {
          const [v, path] = stack.pop();
          if (v === bottom) return path;
          for (const b of bitsOf(v, k)) {
            const u = v & ~(1 << b);
            if (ownedSet.has(u) && !seen.has(u)) {
              seen.add(u);
              stack.push([u, [...path, u]]);
            }
          }
        }
        return null;
      }

      function Board({
        k,
        players,
        owners,
        lastMove,
        onClaim,
        zoom,
        setZoom,
        pan,
        setPan,
        disabled,
        revealState,
        onIntroComplete,
      }) {
        const W = 700,
          H = 700;
        const board = useMemo(() => layoutNodes(k, W, H, 50), [k]);
        const svgRef = useRef(null);
        const dragging = useRef(false);
        const lastPt = useRef({ x: 0, y: 0 });

        useEffect(() => {
          const svg = svgRef.current;
          if (!svg || revealState !== "ready") return;
          const pt = (e) => ({ x: e.clientX, y: e.clientY });
          const onWheel = (e) => {
            e.preventDefault();
            setZoom((z) =>
              Math.min(2, Math.max(0.5, z - Math.sign(e.deltaY) * 0.08)),
            );
          };
          const onDown = (e) => {
            dragging.current = true;
            lastPt.current = pt(e);
            svg.style.cursor = "grabbing";
          };
          const onMove = (e) => {
            if (!dragging.current) return;
            const p = pt(e);
            setPan((pan) => ({
              x: pan.x + (p.x - lastPt.current.x) / zoom,
              y: pan.y + (p.y - lastPt.current.y) / zoom,
            }));
            lastPt.current = p;
          };
          const onUp = () => {
            dragging.current = false;
            svg.style.cursor = "default";
          };
          svg.addEventListener("wheel", onWheel, { passive: false });
          svg.addEventListener("pointerdown", onDown);
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
          return () => {
            svg.removeEventListener("wheel", onWheel);
            svg.removeEventListener("pointerdown", onDown);
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
          };
        }, [zoom, setZoom, setPan, revealState]);

        useEffect(() => {
          if (revealState !== "running") return;
          const svg = svgRef.current;
          if (!svg) return;
          if (
            matchMedia("(prefers-reduced-motion: reduce)").matches ||
            !svg.animate
          ) {
            onIntroComplete();
            return;
          }
          const shuffled = (items) => {
            const result = Array.from(items);
            for (let i = result.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
          };
          let cancelled = false;
          const animations = [];
          const nodes = shuffled(svg.querySelectorAll(".node"));
          nodes.forEach((node, rank) => {
            const delay = (rank / Math.max(1, nodes.length - 1)) * 480;
            const circle = node.querySelector("circle");
            animations.push(
              circle.animate(
                [
                  { opacity: 0, transform: "scale(.55)" },
                  { opacity: 1, transform: "scale(1)" },
                ],
                {
                  duration: 280,
                  delay,
                  easing: "cubic-bezier(.2,.7,.3,1)",
                  fill: "both",
                },
              ),
            );
            animations.push(
              node
                .querySelector("text")
                .animate([{ opacity: 0 }, { opacity: 1 }], {
                  duration: 220,
                  delay,
                  fill: "both",
                }),
            );
          });
          const edges = shuffled(svg.querySelectorAll(".board-edge"));
          edges.forEach((line, rank) => {
            animations.push(
              line.animate(
                [
                  { opacity: 0, strokeDasharray: "1 1", strokeDashoffset: 1 },
                  { opacity: 1, strokeDasharray: "1 1", strokeDashoffset: 0 },
                ],
                {
                  duration: 250,
                  delay: 820 + (rank / Math.max(1, edges.length - 1)) * 350,
                  easing: "ease-out",
                  fill: "both",
                },
              ),
            );
          });
          Promise.all(animations.map((a) => a.finished))
            .then(() => {
              if (!cancelled) onIntroComplete();
            })
            .catch(() => {});
          return () => {
            cancelled = true;
            animations.forEach((a) => a.cancel());
          };
        }, [revealState, k, onIntroComplete]);

        const baseR = 18;
        return html`<div class="board-wrap">
          <svg ref=${svgRef} viewBox="0 0 ${W} ${H}">
            <g transform=${`translate(${pan.x},${pan.y}) scale(${zoom})`}>
              ${board.edges.map(([v, w], i) => {
                const p = board.positions.get(v),
                  q = board.positions.get(w);
                const ownerV = owners.get(v),
                  ownerW = owners.get(w);
                let stroke = "#d7d9d7",
                  width = 3;
                if (ownerV != null && ownerV === ownerW) {
                  stroke = players[ownerV].color;
                  width = 2.4;
                }
                return html`<line
                  key=${i}
                  class="board-edge"
                  pathLength="1"
                  x1=${p.x}
                  y1=${p.y}
                  x2=${q.x}
                  y2=${q.y}
                  stroke=${stroke}
                  stroke-width=${width}
                ></line>`;
              })}
              ${range(1 << k).map((v) => {
                const { x, y } = board.positions.get(v);
                const owner = owners.get(v);
                const cls =
                  (owner != null ? "owned " : "") +
                  (lastMove === v ? "lastmove" : "");
                return html`<g
                  key=${v}
                  class="node"
                  transform=${`translate(${x},${y})`}
                >
                  <circle
                    r=${baseR}
                    fill=${owner != null ? players[owner].color : "#d7d9d7"}
                    class=${cls}
                    onClick=${() => onClaim(v)}
                    style=${disabled ? "cursor:not-allowed" : ""}
                  ></circle>
                  <text
                    y=${10}
                    text-anchor="middle"
                    onClick=${() => onClaim(v)}
                    style="font-size: 1.8em; font-family: Arial, sans-serif;"
                  >
                    ${owner != null ? players[owner].name : ""}
                  </text>
                </g>`;
              })}
            </g>
          </svg>
        </div>`;
      }

      const instructionsHtml = {
        __html: document.getElementById("instructions-tpl").innerHTML,
      };
      const closeIcon = html`<svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>`;

      function ResultModal({
        result,
        title,
        room,
        isHost,
        busy,
        error,
        onRestart,
        onCreate,
        onLocal,
      }) {
        const ref = useRef(null);
        const [dismissed, setDismissed] = useState(false);
        useEffect(() => {
          setDismissed(false);
        }, [result]);
        useEffect(() => {
          const d = ref.current;
          if (result && !dismissed) {
            if (!d.open) d.showModal();
          } else if (d.open) d.close();
          return () => {
            if (d.open) d.close();
          };
        }, [result, dismissed]);
        return html`<div>
          ${result && dismissed
            ? html`<button
                class="result-reopen btn btn-light"
                onClick=${() => setDismissed(false)}
              >
                View result
              </button>`
            : null}
          <dialog
            ref=${ref}
            class="result-dialog"
            aria-labelledby="game-result-title"
            aria-describedby="game-result-description"
            onCancel=${() => setDismissed(true)}
          >
            <div class="result-content">
              <button
                class="result-close btn btn-light"
                aria-label="Close game result"
                onClick=${() => setDismissed(true)}
              >
                ×
              </button>
              <p class="small text-secondary">Game over</p>
              <h2 id="game-result-title" class="h2">${title}</h2>
              <p id="game-result-description">
                ${result === "guest-left"
                  ? "The other player disconnected. Create a new online game to invite someone, or switch to a local game. If they reconnect before you leave, you can continue this match."
                  : result === "tie"
                    ? "All nodes are claimed, but neither player connected the top to the bottom."
                    : "A winning path connects the top to the bottom."}
              </p>
              <div class="d-grid gap-2 mt-4">
                ${result === "guest-left"
                  ? html`
                      <button
                        class="btn btn-primary"
                        disabled=${busy}
                        onClick=${onCreate}
                      >
                        ${busy ? "Creating…" : "Create New Online Game"}
                      </button>
                      <button
                        class="btn btn-outline-primary"
                        disabled=${busy}
                        onClick=${onLocal}
                      >
                        Play Local Game
                      </button>
                    `
                  : html`
                      ${!room || isHost
                        ? html`
                            <button
                              class="btn btn-primary"
                              disabled=${busy}
                              onClick=${onRestart}
                            >
                              ${busy ? "Please wait…" : "Start New Game"}
                            </button>
                          `
                        : null}
                      ${!room
                        ? html`<button
                            class="btn btn-outline-primary"
                            disabled=${busy}
                            onClick=${onCreate}
                          >
                            Create Online Game
                          </button>`
                        : null}
                    `}
              </div>
              ${room && !isHost
                ? html`<p class="small mt-3">
                    Waiting for the host to start a new game.
                  </p>`
                : null}
              ${error
                ? html`<p class="text-danger small mt-3" role="status">
                    ${error}
                  </p>`
                : null}
            </div>
          </dialog>
        </div>`;
      }

      function App() {
        const [k, setK] = useState(4);
        const [gameStarted, setGameStarted] = useState(
          () => !!new URLSearchParams(location.search).get("room"),
        );
        const [setupClosing, setSetupClosing] = useState(false);
        const [introDone, setIntroDone] = useState(false);
        const [desktopView, setDesktopView] = useState(
          () => matchMedia("(min-width: 992px)").matches,
        );
        const setupRef = useRef(null);
        const setupTimer = useRef(null);
        const finishIntro = useCallback(() => setIntroDone(true), []);
        useEffect(() => {
          const media = matchMedia("(min-width: 992px)");
          const change = () => setDesktopView(media.matches);
          media.addEventListener("change", change);
          return () => media.removeEventListener("change", change);
        }, []);
        useEffect(() => {
          const dialog = setupRef.current;
          if (!gameStarted) {
            if (!dialog.open) dialog.showModal();
          } else if (dialog.open) dialog.close();
          return () => {
            if (dialog.open) dialog.close();
          };
        }, [gameStarted]);
        useEffect(() => () => clearTimeout(setupTimer.current), []);
        const playLocalFromSetup = () => {
          if (setupClosing) return;
          setNetError("");
          setSetupClosing(true);
          const delay = matchMedia("(prefers-reduced-motion: reduce)").matches
            ? 0
            : 180;
          setupTimer.current = setTimeout(() => {
            setOpenPanel(null);
            setMessage("X goes first. Select a node to play.");
            setGameStarted(true);
            setSetupClosing(false);
          }, delay);
        };
        const [players] = useState([
          { id: 0, name: "X", color: "#22c55e" },
          { id: 1, name: "O", color: "#60a5fa" },
        ]);
        const [current, setCurrent] = useState(0);
        const localStarter = useRef(0);
        const [localScores, setLocalScores] = useState({
          wins: [0, 0],
          ties: 0,
        });
        const [owners, setOwners] = useState(() => new Map());
        const [lastMove, setLastMove] = useState(null);
        const [history, setHistory] = useState([]);
        const [zoom, setZoom] = useState(1);
        const [pan, setPan] = useState({ x: 0, y: 0 });
        const [message, setMessage] = useState("Select a node to play.");
        const createdRoomOnArrival = useMemo(() => {
          try {
            const id = new URLSearchParams(location.search).get("room");
            return !!id && sessionStorage.getItem("bool-created-room") === id;
          } catch {
            return false;
          }
        }, []);
        const [openPanel, setOpenPanel] = useState(() =>
          createdRoomOnArrival ? "controls" : null,
        );
        const waitingControls = useRef(createdRoomOnArrival);
        useEffect(() => {
          if (createdRoomOnArrival) {
            try {
              sessionStorage.removeItem("bool-created-room");
            } catch {}
          }
        }, [createdRoomOnArrival]);
        const dismissControls = () => {
          waitingControls.current = false;
          setOpenPanel(null);
        };
        const [online, setOnline] = useState(null);
        const [netError, setNetError] = useState("");
        const [busy, setBusy] = useState(false);
        const [recordOpen, setRecordOpen] = useState(false);
        const recordRef = useRef(null);
        useEffect(() => {
          const dialog = recordRef.current;
          if (recordOpen) {
            if (!dialog.open) dialog.showModal();
          } else if (dialog.open) dialog.close();
          return () => {
            if (dialog.open) dialog.close();
          };
        }, [recordOpen]);
        const channelRef = useRef(null);
        const [presenceReady, setPresenceReady] = useState(false);
        const [guestPresent, setGuestPresent] = useState(false);
        const [guestLeft, setGuestLeft] = useState(false);
        const [realtimeConnected, setRealtimeConnected] = useState(false);
        const [presenceError, setPresenceError] = useState("");
        const reconnectTimer = useRef(null);
        const onlineRef = useRef(null);
        const presenceReadyRef = useRef(false);
        const guestPresentRef = useRef(false);
        const realtimeConnectedRef = useRef(false);
        const RECONNECT_GRACE_MS = 10000;

        const [nameDraft, setNameDraft] = useState("");
        const nameInitialized = useRef(false);
        const [savingName, setSavingName] = useState(false);
        const [nameFeedback, setNameFeedback] = useState("");
        const onlineNames = online?.names || ["Player 1", "Player 2"];
        const displayName = (seat) =>
          room ? onlineNames[seat] : players[seat].name;

        const room = useMemo(
          () => new URLSearchParams(location.search).get("room"),
          [],
        );

        useEffect(() => {
          if (!waitingControls.current || online?.seat !== 0) return;
          if (online.guestJoined || (presenceReady && guestPresent)) {
            waitingControls.current = false;
            setOpenPanel((panel) => (panel === "controls" ? null : panel));
          }
        }, [online?.seat, online?.guestJoined, presenceReady, guestPresent]);

        const getToken = () => {
          let token = localStorage.getItem("bool-player-token");
          if (!token || token.length < 20) {
            token = crypto.randomUUID();
            localStorage.setItem("bool-player-token", token);
          }
          return token;
        };

        const applyGame = useCallback(
          (data) => {
            onlineRef.current = {
              seat: data.seat,
              guestJoined: data.guest_joined,
              finished:
                data.winner != null ||
                Object.keys(data.owners || {}).length === 1 << data.board_size,
            };
            setK(data.board_size);
            setOwners(
              new Map(
                Object.entries(data.owners || {}).map(([n, p]) => [
                  Number(n),
                  p,
                ]),
              ),
            );
            setCurrent(data.current_player);
            setLastMove(data.last_move);
            setOnline({
              id: data.game_id,
              seat: data.seat,
              guestJoined: data.guest_joined,
              winner: data.winner,
              scores: {
                wins: [data.player1_wins || 0, data.player2_wins || 0],
                ties: data.tied_games || 0,
              },
              names: [
                data.host_name || "Player 1",
                data.guest_name || "Player 2",
              ],
            });
            if (!nameInitialized.current) {
              setNameDraft(
                (data.seat === 0 ? data.host_name : data.guest_name) || "",
              );
              nameInitialized.current = true;
            }
            const names = [
              data.host_name || "Player 1",
              data.guest_name || "Player 2",
            ];
            if (data.winner != null) {
              setMessage(`${names[data.winner]} connected Top ↔ Bottom!`);
            } else if (
              Object.keys(data.owners || {}).length ===
              1 << data.board_size
            ) {
              setMessage("It's a tie! All nodes are claimed.");
            } else if (!data.guest_joined) {
              setMessage("Waiting for the other player to join…");
            } else {
              setMessage(`${names[data.current_player]}'s turn.`);
            }
            setNetError("");
          },
          [players],
        );

        const loadGame = useCallback(
          async (id) => {
            const { data, error } = await sb.rpc("get_bool_game", {
              p_game_id: id,
              p_token: getToken(),
            });
            if (error) {
              setNetError(error.message);
              return false;
            }
            applyGame(data);
            return true;
          },
          [applyGame],
        );

        const ping = () => {
          channelRef.current?.send({
            type: "broadcast",
            event: "game-updated",
            payload: {},
          });
        };

        const rpcAction = useCallback(
          async (fn, args, fallbackMessage) => {
            if (busy) return;
            setBusy(true);
            try {
              const { data, error } = await sb.rpc(fn, args);
              if (error) throw error;
              const ok = await loadGame(room);
              if (ok) ping();
              if (fallbackMessage) setMessage(fallbackMessage);
              return data;
            } catch (e) {
              setNetError(e.message || "Something went wrong.");
            } finally {
              setBusy(false);
            }
          },
          [busy, loadGame, room],
        );

        useEffect(() => {
          if (!room) return;
          let cancelled = false;
          let channel = null;
          const clearGrace = () => {
            clearTimeout(reconnectTimer.current);
            reconnectTimer.current = null;
          };
          const suspendPresence = () => {
            realtimeConnectedRef.current = false;
            presenceReadyRef.current = false;
            setRealtimeConnected(false);
            setPresenceReady(false);
            setGuestLeft(false);
            clearGrace();
          };
          const pageHide = () => {
            if (channel) channel.untrack();
          };
          const pageShow = (event) => {
            if (event.persisted) location.reload();
          };
          (async () => {
            try {
              const { data: seat, error } = await sb.rpc("join_bool_game", {
                p_game_id: room,
                p_token: getToken(),
              });
              if (cancelled) return;
              if (error) {
                setNetError(error.message);
                return;
              }
              if (!(await loadGame(room)) || cancelled) return;
              channel = sb.channel(`bool-game:${room}`, {
                config: { presence: { key: crypto.randomUUID() } },
              });
              const syncPresence = () => {
                if (cancelled || !realtimeConnectedRef.current) return;
                const present = Object.values(channel.presenceState())
                  .flat()
                  .some((p) => p.seat === 1);
                guestPresentRef.current = present;
                presenceReadyRef.current = true;
                setGuestPresent(present);
                setPresenceReady(true);
                if (present) {
                  clearGrace();
                  setGuestLeft(false);
                }
              };
              channel
                .on("broadcast", { event: "game-updated" }, () => {
                  if (!cancelled) loadGame(room);
                })
                .on("presence", { event: "sync" }, syncPresence)
                .subscribe(async (status) => {
                  if (cancelled) return;
                  if (status === "SUBSCRIBED") {
                    realtimeConnectedRef.current = true;
                    setRealtimeConnected(true);
                    setPresenceError("");
                    const tracked = await channel.track({ seat });
                    if (cancelled) return;
                    if (tracked !== "ok") {
                      suspendPresence();
                      setPresenceError(
                        "Couldn't share connection status. Reload to try again.",
                      );
                      return;
                    }
                    syncPresence();
                    loadGame(room);
                    channel.send({
                      type: "broadcast",
                      event: "game-updated",
                      payload: {},
                    });
                  } else if (
                    ["CHANNEL_ERROR", "TIMED_OUT", "CLOSED"].includes(status)
                  ) {
                    suspendPresence();
                    setPresenceError(
                      "Your realtime connection is interrupted. Waiting to reconnect…",
                    );
                  }
                });
              channelRef.current = channel;
              window.addEventListener("pagehide", pageHide);
              window.addEventListener("pageshow", pageShow);
            } catch (error) {
              if (!cancelled)
                setNetError(error.message || "Could not join this game.");
            }
          })();
          return () => {
            cancelled = true;
            clearGrace();
            window.removeEventListener("pagehide", pageHide);
            window.removeEventListener("pageshow", pageShow);
            if (channel) sb.removeChannel(channel);
            if (channelRef.current === channel) channelRef.current = null;
          };
        }, [room, loadGame]);

        useEffect(() => {
          clearTimeout(reconnectTimer.current);
          reconnectTimer.current = null;
          if (
            !room ||
            online?.seat !== 0 ||
            !online?.guestJoined ||
            online?.winner != null ||
            owners.size === 1 << k ||
            !presenceReady ||
            !realtimeConnected ||
            guestPresent
          ) {
            setGuestLeft(false);
            return;
          }
          reconnectTimer.current = setTimeout(() => {
            const state = onlineRef.current;
            if (
              state?.seat === 0 &&
              state.guestJoined &&
              !state.finished &&
              realtimeConnectedRef.current &&
              presenceReadyRef.current &&
              !guestPresentRef.current
            ) {
              setGuestLeft(true);
            }
          }, RECONNECT_GRACE_MS);
          return () => clearTimeout(reconnectTimer.current);
        }, [
          room,
          online?.seat,
          online?.guestJoined,
          online?.winner,
          owners.size,
          k,
          presenceReady,
          realtimeConnected,
          guestPresent,
        ]);

        useEffect(() => {
          if (!room) return;
          const timer = setInterval(() => loadGame(room), 10000);
          return () => clearInterval(timer);
        }, [room, loadGame]);

        useEffect(() => {
          const onKey = (e) => {
            if (e.key === "Escape" && !recordRef.current?.open)
              dismissControls();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, []);

        const ownedByPlayer = useMemo(() => {
          const map = new Map(players.map((p) => [p.id, new Set()]));
          owners.forEach((pi, node) => map.get(pi)?.add(node));
          return map;
        }, [owners, players]);

        const victory = useMemo(() => {
          for (let i = 0; i < players.length; i++) {
            const path = computePath(k, ownedByPlayer.get(i));
            if (path) return { playerIndex: i, path };
          }
          return null;
        }, [ownedByPlayer, k]);

        const winnerIndex = room ? online?.winner : victory?.playerIndex;
        const isTie = winnerIndex == null && !victory && owners.size === 1 << k;
        const result =
          winnerIndex != null
            ? `winner:${winnerIndex}`
            : isTie
              ? "tie"
              : guestLeft && online?.seat === 0
                ? "guest-left"
                : null;
        const resultTitle = isTie
          ? "It's a tie!"
          : winnerIndex != null
            ? `${displayName(winnerIndex)} wins!`
            : result === "guest-left"
              ? `${displayName(1)} left the match`
              : "Game over";

        const completedScores = room
          ? online?.scores || { wins: [0, 0], ties: 0 }
          : localScores;
        const scoreWins = completedScores.wins.map(
          (n, seat) => n + (winnerIndex === seat ? 1 : 0),
        );
        const scoreTies = completedScores.ties + (isTie ? 1 : 0);
        const scoredGames = scoreWins[0] + scoreWins[1] + scoreTies;
        useEffect(() => {
          if (result) setRecordOpen(false);
        }, [result]);
        const turnBadge = (() => {
          if (result)
            return {
              text: resultTitle,
              color:
                winnerIndex != null ? players[winnerIndex].color : "#94a3b8",
            };
          if (room && !online)
            return { text: "Joining game…", color: "#94a3b8" };
          if (room && !online.guestJoined)
            return { text: "Waiting for Player 2…", color: "#94a3b8" };
          if (room && (!realtimeConnected || !presenceReady))
            return { text: "Checking connection…", color: "#94a3b8" };
          if (room && !guestPresent)
            return {
              text: `Waiting for ${onlineNames[1]} to reconnect…`,
              color: "#94a3b8",
            };
          const mark = players[current].name;
          return {
            text: room
              ? `${displayName(current)}’s turn (${mark})${online.seat === current ? " · Your turn" : ""}`
              : `${mark}’s turn`,
            color: players[current].color,
          };
        })();

        async function saveName(event) {
          event.preventDefault();
          if (!online || savingName) return;
          setSavingName(true);
          setNameFeedback("");
          try {
            const { error } = await sb.rpc("set_bool_player_name", {
              p_game_id: room,
              p_token: getToken(),
              p_name: nameDraft.trim(),
            });
            if (error) throw error;
            if (await loadGame(room)) {
              ping();
              setNameFeedback("Name saved.");
            } else
              setNameFeedback(
                "Saved, but couldn't refresh. Try again shortly.",
              );
          } catch (e) {
            setNameFeedback(e.message || "Could not save your name.");
          } finally {
            setSavingName(false);
          }
        }

        function reset() {
          if (room) {
            if (online?.seat !== 0) {
              setNetError("Only the host can reset the game.");
              return;
            }
            rpcAction("reset_bool_game", {
              p_game_id: room,
              p_token: getToken(),
            });
            return;
          }
          if (victory || isTie) {
            setLocalScores((prev) => ({
              wins: prev.wins.map(
                (n, seat) => n + (victory?.playerIndex === seat ? 1 : 0),
              ),
              ties: prev.ties + (isTie ? 1 : 0),
            }));
          }
          const starter = victory
            ? 1 - victory.playerIndex
            : localStarter.current;
          localStarter.current = starter;
          setOwners(new Map());
          setHistory([]);
          setLastMove(null);
          setCurrent(starter);
          setMessage(
            `${players[starter].name} goes first. Select a node to play.`,
          );
        }

        function undo() {
          if (room) {
            if (online?.seat !== 0) {
              setNetError("Only the host can undo.");
              return;
            }
            rpcAction(
              "undo_bool_game",
              { p_game_id: room, p_token: getToken() },
              "Undid last move.",
            );
            return;
          }
          if (!history.length) return;
          const prev = history[history.length - 1];
          setOwners(new Map(prev.owners));
          setCurrent(prev.current);
          setLastMove(prev.lastMove);
          setHistory((h) => h.slice(0, -1));
          setMessage("Undid last move.");
        }

        function handleClaim(node) {
          if (!gameStarted || !introDone) return;
          if (room) {
            if (presenceReady && (!realtimeConnected || !guestPresent)) {
              setNetError("Waiting for Player 2 to reconnect.");
              return;
            }
            if (!online?.guestJoined) {
              setNetError("Waiting for the other player to join.");
              return;
            }
            if (result) {
              setNetError("Game finished. The host can reset it.");
              return;
            }
            if (online.seat !== current) {
              setNetError("Wait for your turn.");
              return;
            }
            rpcAction("make_bool_move", {
              p_game_id: room,
              p_token: getToken(),
              p_node: node,
            });
            return;
          }
          if (result) return;
          if (owners.has(node)) {
            setMessage("Already claimed.");
            return;
          }
          setHistory((h) => [
            ...h,
            { owners: new Map(owners), current, lastMove },
          ]);
          const preOwned = new Set();
          owners.forEach((pi, n) => {
            if (pi === current) preOwned.add(n);
          });
          const newOwners = new Map(owners);
          newOwners.set(node, current);
          for (const s of preOwned) {
            newOwners.set(s & node, current);
            newOwners.set(s | node, current);
          }
          setOwners(newOwners);
          setLastMove(node);
          const ownedNow = new Set();
          newOwners.forEach((pi, n) => {
            if (pi === current) ownedNow.add(n);
          });
          if (computePath(k, ownedNow)) {
            setMessage(`${players[current].name} connected Top ↔ Bottom!`);
          } else if (newOwners.size === 1 << k) {
            setMessage("It's a tie! All nodes are claimed.");
          } else {
            setCurrent((current + 1) % players.length);
            setMessage(
              `${players[(current + 1) % players.length].name}'s turn.`,
            );
          }
        }

        function incrementK() {
          if (room) {
            if (online?.seat !== 0) {
              setNetError("Only the host can change the board size.");
              return;
            }
            rpcAction("resize_bool_game", {
              p_game_id: room,
              p_token: getToken(),
              p_board_size: Math.min(5, k + 1),
            });
            return;
          }
          setK((k) => Math.min(5, k + 1));
          reset();
        }

        function decrementK() {
          if (room) {
            if (online?.seat !== 0) {
              setNetError("Only the host can change the board size.");
              return;
            }
            rpcAction("resize_bool_game", {
              p_game_id: room,
              p_token: getToken(),
              p_board_size: Math.max(4, k - 1),
            });
            return;
          }
          setK((k) => Math.max(4, k - 1));
          reset();
        }

        async function createRoom() {
          if (busy) return;
          setBusy(true);
          try {
            const { data, error } = await sb.rpc("create_bool_game", {
              p_token: getToken(),
              p_board_size: k,
            });
            if (error) throw error;
            try {
              sessionStorage.setItem("bool-created-room", String(data));
            } catch {}
            if (!gameStarted) {
              setSetupClosing(true);
              await new Promise((resolve) =>
                setTimeout(
                  resolve,
                  matchMedia("(prefers-reduced-motion: reduce)").matches
                    ? 0
                    : 180,
                ),
              );
            }
            location.search = `?room=${data}`;
          } catch (e) {
            setNetError(e.message || "Could not create the game.");
            setBusy(false);
          }
        }

        async function copyInvite() {
          try {
            await navigator.clipboard.writeText(location.href);
            setNetError("Invite link copied.");
          } catch {

        const toggle = (name) => {

          setOpenPanel((p) => (p === name ? null : name));

        const panelClass = (name) =>

          (!room || !!online) &&
          (desktopView || openPanel === null);
        const revealState = introDone
          ? "ready"
          : boardVisible

            : "pending";

        return html`<div

            </div>
          </dialog>
          <dialog
            id="match-record-dialog"
            ref=${recordRef}

            <section

                  <tr>

                </thead>
                <tbody>
                  ${players.map(
                    (player, seat) => html`
                      <tr key=${seat}>
                        <th scope="row">
                          <span

          <${ResultModal}

          <div class="layout">

            <section

                <div class="d-flex align-items-center gap-2">
                  <span>Number of Nodes</span>
                  <button

                  <span>${2 ** k}</span>

                      <form

                        <label for="player-name"

                        >
                        <input
                          id="player-name"
                          class="form-control form-control-sm"

                            ? "Player 2"

                          disabled=${!online || savingName}
                          aria-describedby="player-name-help"
                          onInput=${(e) => {
                            setNameDraft(e.target.value);
                            setNameFeedback("");

                        <small id="player-name-help"

                          ${online?.seat === 1 ? "Player 2" : "Player 1"}. Up to
                          40 characters.</small

                        <button
                          type="submit"
                          class="btn btn-light btn-sm"

                        <small role="status" aria-live="polite"

                      </form>
                      <label for="invite-link">Invite link</label>
                      <input
                        id="invite-link"

                        Copy invite link

                      <small

                      <a class="text-white" href=${location.pathname}

                  : html`<button
                        class="btn btn-light"
                        onClick=${createRoom}
                        disabled=${busy}
                      >
                        ${busy ? "Creating…" : "Create online game"}
                      </button>
                      <small
                        >Create a room, then share the invite link with one
                        other player.</small
                      >`}
              </div>

              <div class="controls-footer d-none d-lg-flex flex-column gap-2">
                <button
                  type="button"
                  class="btn btn-outline-light btn-sm w-100 d-flex justify-content-center align-items-center gap-2"
                  aria-haspopup="dialog"
                  aria-controls="match-record-dialog"
                  onClick=${() => setRecordOpen(true)}
                >
                  <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4Z" />
                    <path d="M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4" />
                  </svg>
                  Match Record
                </button>
                <button
                  type="button"
                  class="btn btn-outline-light btn-sm w-100 d-flex justify-content-center align-items-center gap-2"
                  aria-controls="instructions-panel"
                  aria-expanded=${openPanel === "instructions"}
                  onClick=${() => toggle("instructions")}
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z" />
                    <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z" />
                  </svg>
                  Instructions
                </button>
              </div>
            </section>

            <section
              id="instructions-panel"
              class=${panelClass("instructions")}
              role="dialog"
              aria-label="Instructions"
            >
              <button
                type="button"
                class="close-btn btn btn-link text-black p-0 d-flex align-items-center justify-content-center"
                aria-label="Close instructions"
                onClick=${() => setOpenPanel(null)}
              >
                ${closeIcon}
              </button>
              <div
                class="panel-scroll pe-5 pe-lg-4"
                dangerouslySetInnerHTML=${instructionsHtml}
              ></div>
            </section>
          </div>

          <nav
            class="bottom-nav d-flex d-lg-none flex-shrink-0"
            aria-label="Primary"
          >
            <button
              type="button"
              class="nav-tab btn flex-fill d-flex flex-column align-items-center justify-content-center gap-1"
              aria-pressed=${openPanel === "controls"}
              onClick=${() => toggle("controls")}
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <line x1="4" y1="21" x2="4" y2="14" />
                <line x1="4" y1="10" x2="4" y2="3" />

                <line x1="12" y1="8" x2="12" y2="3" />
                <line x1="20" y1="21" x2="20" y2="16" />
                <line x1="20" y1="12" x2="20" y2="3" />
                <line x1="2" y1="14" x2="6" y2="14" />
                <line x1="10" y1="8" x2="14" y2="8" />
                <line x1="18" y1="16" x2="22" y2="16" />
              </svg>
              Controls
            </button>
            <button
              type="button"
              class="nav-tab btn flex-fill d-flex flex-column align-items-center justify-content-center gap-1"
              aria-haspopup="dialog"
              aria-controls="match-record-dialog"
              onClick=${() => setRecordOpen(true)}
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4Z" />
                <path d="M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4" />
              </svg>
              Match Record
            </button>
            <button
              type="button"
              class="nav-tab btn flex-fill d-flex flex-column align-items-center justify-content-center gap-1"
              aria-pressed=${openPanel === "instructions"}
              onClick=${() => toggle("instructions")}
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z" />
                <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z" />
              </svg>
              Instructions
            </button>
          </nav>
        </div>`;
      }

      render(html`<${App} />`, document.getElementById("app"));

      // Diagrams for Join and Meet. Nodes: [id, x, y, label, color, radius]
      function drawGraph(id, nodes, edges, notes) {
        const ctx = document.getElementById(id).getContext("2d");
        const byId = Object.fromEntries(nodes.map((n) => [n[0], n]));
        edges.forEach(([a, b]) => {
          ctx.beginPath();
          ctx.moveTo(byId[a][1], byId[a][2]);
          ctx.lineTo(byId[b][1], byId[b][2]);
          ctx.strokeStyle = "gray";
          ctx.stroke();
        });
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        nodes.forEach(([, x, y, label, color, rad]) => {
          ctx.beginPath();
          ctx.arc(x, y, rad, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.strokeStyle = "blue";
          ctx.stroke();
          ctx.fillStyle = "black";
          ctx.fillText(label, x, y);
        });
        (notes || []).forEach(([t, x, y]) => ctx.fillText(t, x, y));
      }

      const LB = "lightblue",
        LG = "lightgreen",
        PK = "pink";
      const fiveEdges = [
        ["A", "B"],
        ["E", "A"],
        ["E", "B"],
        ["E", "D"],
        ["B", "D"],
        ["C", "D"],
      ];
      const fourEdges = [
        ["A", "B"],
        ["E", "A"],
        ["E", "D"],
        ["B", "D"],
      ];
      const triEdges = [
        ["A", "B"],
        ["A", "U"],
        ["B", "U"],
      ];

      drawGraph(
        "g1",
        [
          ["A", 100, 150, "A", LB, 15],
          ["B", 250, 100, "Join", LG, 25],
          ["C", 200, 250, "B", LB, 15],
          ["D", 350, 200, "", LB, 15],
          ["E", 300, 40, "Not Join", PK, 20],
        ],
        fiveEdges,
        [
          ["Join of A and B", 400, 100],
          ["is the lowest vertex that has", 400, 120],
          ["downward paths to A and B", 400, 140],
        ],
      );
      drawGraph(
        "g2",
        [
          ["A", 100, 150, "A", LB, 15],
          ["B", 250, 100, "Join", LG, 25],
          ["D", 350, 200, "B", LB, 15],
          ["E", 300, 40, "Not Join", PK, 20],
        ],
        fourEdges,
      );
      drawGraph(
        "g3",
        [
          ["A", 100, 150, "A", LB, 15],
          ["B", 250, 100, "B=Join", LG, 25],
          ["U", 225, 40, "Not Join", PK, 20],
        ],
        triEdges,
        [
          ["Stay-put path from Join to B", 400, 100],
          ["Downward path from Join to A", 400, 120],
        ],
      );
      drawGraph(
        "g4",
        [
          ["A", 100, 100, "A", LB, 15],
          ["B", 250, 200, "Meet", LG, 28],
          ["C", 200, 20, "B", LB, 15],
          ["D", 350, 100, "", LB, 15],
          ["E", 300, 300, "Not Meet", PK, 23],
        ],
        fiveEdges,
        [
          ["Meet of A and B", 400, 200],
          ["is the highest vertex that has", 400, 220],
          ["upward paths to A and B", 400, 240],
        ],
      );
      drawGraph(
        "g5",
        [
          ["A", 100, 50, "A", LB, 15],
          ["B", 250, 150, "Meet", LG, 28],
          ["D", 350, 100, "B", LB, 15],
          ["E", 300, 250, "Not Meet", PK, 23],
        ],
        fourEdges,
      );
      drawGraph(
        "g6",
        [
          ["A", 250, 40, "B", LB, 15],
          ["B", 100, 100, "A=Meet", LG, 28],
          ["U", 225, 160, "Not Meet", PK, 23],
        ],
        triEdges,
        [
          ["Stay-put path from Meet to A", 400, 100],
          ["Upward path from Meet to B", 400, 120],
        ],
      );
    </script>
